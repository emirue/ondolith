{{define "content"}}
<p>현재 테마: <strong>{{if .Active}}{{.Active}}{{else}}(내장){{end}}</strong></p>
<form method="post" action="/admin/themes">
  <label for="theme">테마 디렉터리 이름</label>
  <input type="text" id="theme" name="theme" value="{{.Active}}" placeholder="(비우면 내장 테마)">
  <p><button class="primary">활성화</button></p>
</form>
<p class="muted">
  base.html 이 없거나 요구 버전이 현재 버전보다 높으면 거부됩니다.
  개발 빌드에서는 버전 검사를 건너뛰고 경고만 합니다.
</p>
{{end}}
