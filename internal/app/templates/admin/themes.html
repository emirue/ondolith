{{define "content"}}
<div class="adm-card">
  <p>현재 테마: <strong>{{if .Active}}{{.Active}}{{else}}(내장){{end}}</strong></p>
  <form method="post" action="/admin/themes">
    <label class="adm-field">
      <span>테마 디렉터리 이름</span>
      <input type="text" name="theme" value="{{.Active}}" placeholder="(비우면 내장 테마)">
    </label>
    <div class="adm-actions" style="justify-content:flex-end">
      <button class="adm-btn adm-btn--primary">활성화</button>
    </div>
  </form>
  <p class="adm-hint">
    base.html 이 없거나 요구 버전이 현재 버전보다 높으면 거부됩니다.
    개발 빌드에서는 버전 검사를 건너뛰고 경고만 합니다.
  </p>
</div>
{{end}}
