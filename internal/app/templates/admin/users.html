{{define "content"}}
<div class="overflow">
<table>
  <thead><tr><th>이메일</th><th>이름</th><th>역할</th><th>상태</th><th></th></tr></thead>
  <tbody>
  {{range .Users}}
    <tr>
      <td><a href="/admin/users/{{.ID}}">{{.Email}}</a></td>
      <td>{{.DisplayName}}</td>
      <td class="muted">{{range .Roles}}{{.}} {{end}}</td>
      <td>{{if .IsActive}}활성{{else}}비활성{{end}}{{if not .Verified}} · 미인증{{end}}</td>
      <td><a href="/admin/users/{{.ID}}">상세</a></td>
    </tr>
  {{else}}
    <tr><td colspan="5" class="muted">사용자가 없습니다.</td></tr>
  {{end}}
  </tbody>
</table>
</div>
<p class="actions">
  {{if gt .Page 0}}<a href="/admin/users?page={{.Prev}}"><button>이전</button></a>{{end}}
  <a href="/admin/users?page={{.Next}}"><button>다음</button></a>
</p>
<h3>사용자 추가</h3>
<form method="post" action="/admin/users">
  <label for="email">이메일</label>
  <input type="email" id="email" name="email" required>
  <label for="display_name">표시 이름</label>
  <input type="text" id="display_name" name="display_name" required>
  <label for="password">초기 비밀번호</label>
  <input type="password" id="password" name="password" autocomplete="new-password" required>
  <p><button class="primary">생성</button></p>
</form>
<p class="muted">역할은 생성 시 붙지 않습니다. 역할·권한 화면에서 부여하세요.</p>
{{end}}
