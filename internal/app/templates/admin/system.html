{{define "content"}}
<div class="adm-cards">
  <div class="adm-card">
    <div class="adm-stat-label">버전</div>
    <div class="adm-stat-value" style="font-size:20px">{{.Version}}</div>
  </div>
  <div class="adm-card">
    <div class="adm-stat-label">데이터베이스</div>
    <div class="adm-stat-value" style="font-size:20px">{{if .DBReadable}}정상{{else}}읽을 수 없음{{end}}</div>
  </div>
  <div class="adm-card">
    <div class="adm-stat-label">대기 마이그레이션</div>
    <div class="adm-stat-value">{{.Pending}}</div>
  </div>
</div>

<div class="adm-card">
  <h2>적용된 마이그레이션</h2>
  <div class="adm-table-wrap">
    <table class="adm-table">
      <tbody>
      {{range .Applied}}<tr><td class="muted">{{.}}</td></tr>
      {{else}}<tr><td class="adm-empty">없음</td></tr>{{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
