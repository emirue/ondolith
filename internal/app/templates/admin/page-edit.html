{{define "content"}}
<div class="adm-card">
  <form method="post" action="/admin/pages/{{if .Page}}{{.Page.ID}}{{else}}new{{end}}">
    <label class="adm-field">
      <span>제목</span>
      <input type="text" name="title" value="{{with .Page}}{{.Title}}{{end}}" required>
    </label>

    <div class="adm-field-row">
      <label class="adm-field">
        <span>슬러그</span>
        <input type="text" name="slug" value="{{with .Page}}{{.Slug}}{{end}}" required>
      </label>
      <label class="adm-field">
        <span>템플릿</span>
        <input type="text" name="template" value="{{with .Page}}{{.Template}}{{end}}" placeholder="page.html">
      </label>
    </div>

    <label class="adm-field">
      <span>본문</span>
      {{/* 에디터 (FR-513). 글쓰기와 같은 editor.js — 사진은 A-310 으로 올린다. */}}
      <textarea name="body" data-editor data-upload="/admin/pages/media">{{with .Page}}{{.Body}}{{end}}</textarea>
    </label>
    <input type="hidden" name="body_html" value="{{with .Page}}{{.BodyHTML}}{{end}}">
    <link rel="stylesheet" href="/static/vendor/suneditor/suneditor.min.css">
    <script src="/static/vendor/suneditor/suneditor.min.js" defer></script>
    <script src="/static/vendor/suneditor/ko.js" defer></script>
    <script src="/static/js/editor.js" defer></script>

    <div class="adm-actions adm-actions--end">
      <a class="adm-btn" href="/admin/pages">취소</a>
      <button class="adm-btn adm-btn--primary">저장</button>
    </div>
    <p class="adm-hint">발행은 별도 권한입니다 (page.publish). 목록에서 수행하세요.</p>
  </form>
</div>
{{end}}
