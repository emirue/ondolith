{{define "content"}}
<div class="adm-card">
  <form method="post" action="/admin/settings/mail">
    <div class="adm-field-row">
      <label class="adm-field">
        <span>SMTP 호스트</span>
        <input type="text" name="mail.smtp_host" value="{{index .Settings "mail.smtp_host"}}">
      </label>
      <label class="adm-field">
        <span>포트</span>
        <input type="text" name="mail.smtp_port" value="{{index .Settings "mail.smtp_port"}}">
      </label>
    </div>

    <div class="adm-field-row">
      <label class="adm-field">
        <span>사용자</span>
        <input type="text" name="mail.smtp_user" value="{{index .Settings "mail.smtp_user"}}">
      </label>
      <label class="adm-field">
        <span>비밀번호</span>
        <input type="password" name="mail.smtp_password" value="" autocomplete="new-password">
      </label>
    </div>
    <p class="adm-hint">
      {{if index .SecretSaved "mail.smtp_password"}}저장돼 있습니다. 바꿀 때만 입력하세요.
      {{else}}아직 저장되지 않았습니다.{{end}}
      저장된 값은 화면에 다시 표시하지 않습니다.
    </p>

    <div class="adm-field-row">
      <label class="adm-field">
        <span>TLS</span>
        {{$m := index .Settings "mail.tls_mode"}}
        <select name="mail.tls_mode">
          <option value="none"{{if eq $m "none"}} selected{{end}}>없음</option>
          <option value="starttls"{{if eq $m "starttls"}} selected{{end}}>STARTTLS</option>
          <option value="tls"{{if eq $m "tls"}} selected{{end}}>TLS</option>
        </select>
      </label>
      <label class="adm-field">
        <span>보내는 주소</span>
        <input type="text" name="mail.from_address" value="{{index .Settings "mail.from_address"}}">
      </label>
      <label class="adm-field">
        <span>보내는 이름</span>
        <input type="text" name="mail.from_name" value="{{index .Settings "mail.from_name"}}">
      </label>
    </div>

    <div class="adm-actions" style="justify-content:flex-end">
      <button class="adm-btn adm-btn--primary">저장</button>
    </div>
  </form>
</div>
{{end}}
