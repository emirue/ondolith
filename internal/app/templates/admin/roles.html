{{define "content"}}
<div class="adm-card" style="padding:0">
  <div class="adm-table-wrap">
    <table class="adm-table">
      <thead><tr><th>역할 키</th><th>권한</th><th>비고</th></tr></thead>
      <tbody>
      {{range .Roles}}
        <tr>
          <td>{{.Key}}</td>
          <td class="muted">{{len .Permissions}}개 권한</td>
          <td>{{if .Superuser}}<span class="adm-badge">superuser — 서버에서 편집이 거부됩니다</span>{{end}}</td>
        </tr>
      {{else}}
        <tr><td colspan="3" class="adm-empty">역할이 없습니다.</td></tr>
      {{end}}
      </tbody>
    </table>
  </div>
</div>

<div class="adm-card">
  <h2>역할에 권한 부여</h2>
  <form method="post" action="/admin/roles/-/permissions">
    <div class="adm-field-row">
      <label class="adm-field"><span>역할 키</span><input type="text" name="role" required></label>
      <label class="adm-field"><span>권한 키</span><input type="text" name="permission" required></label>
      <label class="adm-field"><span>게시판 (스코프 권한만)</span><input type="text" name="board_id"></label>
    </div>
    <div class="adm-actions" style="justify-content:flex-end">
      <button class="adm-btn adm-btn--primary">부여</button>
    </div>
  </form>
</div>

<div class="adm-card">
  <h2>사용자에게 역할 부여</h2>
  <form method="post" action="/admin/users/-/roles">
    <div class="adm-field-row">
      <label class="adm-field"><span>사용자 ID</span><input type="text" name="user_id" required></label>
      <label class="adm-field"><span>역할 키</span><input type="text" name="role" required></label>
    </div>
    <div class="adm-actions" style="justify-content:flex-end">
      <button class="adm-btn adm-btn--primary">부여</button>
    </div>
  </form>
  <p class="adm-hint">
    자기 자신에게는 부여할 수 없습니다. 보유하지 않은 권한은 어떤 역할에도 넣을 수 없습니다.
  </p>
</div>
{{end}}
