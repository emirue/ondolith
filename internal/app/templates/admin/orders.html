{{define "content"}}
<form method="get" class="filters">
  <label for="status">상태</label>
  <select id="status" name="status" onchange="this.form.submit()">
    <option value="">전체</option>
    {{range .Statuses}}<option value="{{.}}"{{if eq . $.Status}} selected{{end}}>{{.}}</option>{{end}}
  </select>
</form>
<table class="adm-table">
  <thead><tr><th>주문번호</th><th>상태</th><th>금액</th><th>주문자</th><th>주문일</th></tr></thead>
  <tbody>
    {{range .Orders}}
    <tr><td><a href="/admin/orders/{{.OrderNo}}">{{.OrderNo}}</a></td>
        <td>{{.Status}}</td><td>{{money .Total}}</td><td>{{.OrdererEmail}}</td><td>{{date .CreatedAt "2006-01-02 15:04"}}</td></tr>
    {{else}}
    <tr><td colspan="5">주문이 없습니다.</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
