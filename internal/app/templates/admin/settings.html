{{define "content"}}
<div class="adm-card">
  <form method="post" action="/admin/settings">
    <label class="adm-field">
      <span>사이트 이름</span>
      <input type="text" name="site.name" value="{{index .Settings "site.name"}}">
    </label>
    <label class="adm-field">
      <span>기본 메타 설명</span>
      <input type="text" name="site.meta_description" value="{{index .Settings "site.meta_description"}}">
    </label>
    <label class="adm-field">
      <span>기본 OG 이미지 URL</span>
      <input type="text" name="site.og_image" value="{{index .Settings "site.og_image"}}">
    </label>

    <div class="adm-field-row">
      <label class="adm-field">
        <span>사이트 유형</span>
        <select name="site.type">
          <option value="cms"{{if eq (index .Settings "site.type") "cms"}} selected{{end}}>cms — 콘텐츠</option>
          <option value="shop"{{if eq (index .Settings "site.type") "shop"}} selected{{end}}>shop — 커머스</option>
        </select>
        {{/* 커머스 라우트는 **조립 시점에** 등록된다 (FR-710) — 핸들러 안에서
             `if 커머스켜짐` 을 검사하지 않으므로, 유형을 바꿔도 이미 서 있는
             트리는 그대로다. 이 안내가 없으면 저장 뒤 상품 메뉴가 나타나지
             않는 것이 고장으로 보인다. */}}
        <span class="adm-hint">바꾼 뒤 <strong>재시작</strong>해야 상품·주문 화면이 나타나거나 사라집니다.</span>
      </label>
      <label class="adm-field">
        <span>이메일 인증 요구</span>
        <select name="auth.email_verification_required">
          <option value="">아니오</option>
          <option value="1"{{if index .Settings "auth.email_verification_required"}} selected{{end}}>예</option>
        </select>
      </label>
    </div>

    <div class="adm-field-row">
      <label class="adm-field">
        <span>관리자 배색</span>
        {{/* **빈 값이 곧 기본(1b)이다.** 여기서 "1b" 를 골라 놓으면 「고르지
             않았다」와 「1b 를 골랐다」가 같은 모양이 되고, admin.css 의
             `:root:not([data-admin-theme])` 다크 블록이 영원히 매치되지 않는다 —
             그렇게 스무 줄짜리 다크 콘솔이 한 번 죽은 적이 있다. */}}
        <select name="admin.theme">
          <option value="">기본 (1b 모던 소프트)</option>
          <option value="1a"{{if eq (index .Settings "admin.theme") "1a"}} selected{{end}}>1a — 클래식</option>
          <option value="1b"{{if eq (index .Settings "admin.theme") "1b"}} selected{{end}}>1b — 모던 소프트</option>
          <option value="1c"{{if eq (index .Settings "admin.theme") "1c"}} selected{{end}}>1c — 다크</option>
          <option value="1d"{{if eq (index .Settings "admin.theme") "1d"}} selected{{end}}>1d — 하이 콘트라스트</option>
          <option value="1e"{{if eq (index .Settings "admin.theme") "1e"}} selected{{end}}>1e — 컴팩트</option>
        </select>
        <span class="adm-hint">관리자 화면에만 적용됩니다. 라이트/다크는 기본값일 때 OS 설정을 따릅니다. 바꾼 뒤 <strong>재시작</strong>해야 반영됩니다.</span>
      </label>
    </div>

    <div class="adm-actions" style="justify-content:flex-end">
      <button class="adm-btn adm-btn--primary">저장</button>
    </div>
  </form>
</div>
{{end}}
