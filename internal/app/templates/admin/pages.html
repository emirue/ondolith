{{define "content"}}
<p><a href="/admin/pages/new"><button>새 페이지</button></a></p>
<div class="overflow">
<table>
  <thead><tr><th>제목</th><th>슬러그</th><th>상태</th><th>동작</th></tr></thead>
  <tbody>
  {{range .Pages}}
    <tr>
      <td><a href="/admin/pages/{{.ID}}">{{.Title}}</a></td>
      <td class="muted">/{{.Slug}}</td>
      <td>{{.Status}}</td>
      <td class="actions">
        <form method="post" action="/admin/pages/{{.ID}}/publish">
          <input type="hidden" name="status" value="{{if eq .Status "published"}}draft{{else}}published{{end}}">
          <button>{{if eq .Status "published"}}발행 취소{{else}}발행{{end}}</button>
        </form>
        <form method="post" action="/admin/pages/{{.ID}}/delete"><button>삭제</button></form>
      </td>
    </tr>
  {{else}}
    <tr><td colspan="4" class="muted">페이지가 없습니다.</td></tr>
  {{end}}
  </tbody>
</table>
</div>
{{end}}
