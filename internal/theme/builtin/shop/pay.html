{{define "body"}}
<h1>결제</h1>
{{with .Data}}{{with .Order}}
<p>주문번호 <strong>{{.OrderNo}}</strong></p>
<dl class="totals"><dt>결제 금액</dt><dd>{{money .Total}}</dd></dl>
{{end}}
{{/* 결제창은 브라우저 SDK 가 연다. 서버는 공개 클라이언트 키와 저장된 금액만
     넘긴다 — successUrl·failUrl 은 서버가 구성하고, 시크릿은 어떤 경로로도
     여기 오지 않는다 (D19 P-407). */}}
<p class="hint">결제창이 열리지 않으면 아래 버튼을 눌러 주세요.</p>
<form method="get" action="/checkout/success" class="form">
  <button type="submit">결제 진행</button>
</form>
<p><a href="/cart">장바구니로 돌아가기</a></p>
{{end}}
{{end}}
