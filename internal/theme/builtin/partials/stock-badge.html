{{/* 상품의 판매 상태 배지. 목록·검색·홈이 같은 것을 쓰고, 상품 화면과 같은 말을 쓴다 —
     조합이 없으면 「판매 준비 중」, 있는데 재고가 없으면 「품절」. 기대하는 데이터: 상품
