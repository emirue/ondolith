{{define "body"}}
<h1>비밀번호 변경</h1>
{{with .Data}}{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}{{end}}
<form method="post" action="/me/password" class="form">
  <label for="current_password">현재 비밀번호</label>
  <input id="current_password" name="current_password" type="password" required
         autocomplete="current-password">
  <label for="new_password">새 비밀번호</label>
  <input id="new_password" name="new_password" type="password" required minlength="10"
         autocomplete="new-password">
  <p class="hint">10자 이상. 변경하면 다른 기기의 로그인이 모두 해제됩니다.</p>
  <button type="submit">변경</button>
</form>
{{end}}
