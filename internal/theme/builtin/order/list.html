{{define "body"}}
<h1>주문 내역</h1>
{{with .Data}}
<table class="order-list">
  <thead><tr><th>주문번호</th><th>상태</th><th>금액</th><th>주문일</th></tr></thead>
  <tbody>
    {{range .Orders}}
    <tr><td><a href="/orders/{{.OrderNo}}">{{.OrderNo}}</a></td>
        <td>{{.Status}}</td><td>{{money .Total}}</td><td>{{date .CreatedAt "2006-01-02 15:04"}}</td></tr>
    {{else}}
    <tr><td colspan="4" class="empty">주문이 없습니다.</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
{{end}}
