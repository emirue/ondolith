{{define "body"}}
{{/* 인증·내 계정 화면은 **한 축에 선다.** 제목·폼·소셜 버튼·링크가
     각자 다른 폭이면 어느 것이 이 화면의 본체인지 눈이 못 고른다. */}}
<div class="auth">
<h1>비밀번호 재설정</h1>
{{with .Data}}{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}{{end}}
<p>가입한 이메일 주소를 입력하면 재설정 링크를 보냅니다.</p>
<form method="post" action="/password/reset" class="form">
  <label for="email">이메일</label>
  <input id="email" name="email" type="email" required autocomplete="username">
  <button type="submit">재설정 링크 받기</button>
</form>
<p><a href="/login">로그인으로 돌아가기</a></p>
</div>
{{end}}
