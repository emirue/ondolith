{{define "body"}}
<h1>새 비밀번호 설정</h1>
{{with .Data}}{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}{{end}}
{{/* 토큰은 폼 값이 아니라 action 경로에 있다. hidden 필드로 옮기면 값이 폼
     데이터가 되고, 그때부터 "폼에서 온 토큰"과 "경로에서 온 토큰"이 갈린다. */}}
<form method="post" action="/password/reset/{{with .Data}}{{.Token}}{{end}}" class="form">
  <label for="password">새 비밀번호</label>
  <input id="password" name="password" type="password" required minlength="10"
         autocomplete="new-password">
  <label for="password_confirm">새 비밀번호 확인</label>
  <input id="password_confirm" name="password_confirm" type="password" required minlength="10"
         autocomplete="new-password">
  <p class="hint">10자 이상. 설정하면 모든 기기의 로그인이 해제됩니다.</p>
  <button type="submit">비밀번호 변경</button>
</form>
{{end}}
