name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 오프라인 게이트. 개발자가 손으로 돌리는 것과 같은 명령이다 —
  # CI 전용 명령을 두면 둘이 갈라지고, 갈라진 뒤에는 어느 쪽이 진짜인지 모른다.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check

  # **DB 가 붙어야 도는 단언이 절반이다.** DSN 없이 돌리면 커머스·인증·설치의
  # 테스트가 통째로 건너뛰고, 그 상태에서도 `make check` 는 초록이다. 돈이 걸린
  # 경로(결제·환불·반품)를 실제로 실행하는 것은 이 잡뿐이다 (D85 GAP-06).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: ondolith
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # integration.sh 는 DSN 이 있으면 컨테이너를 띄우지 않는다.
      - run: make test-integration
        env:
          ONDOLITH_TEST_DSN: postgres://postgres:testpw@127.0.0.1:5432/ondolith?sslmode=disable

  # **브라우저가 있어야 도는 검사.** `make check` 는 오프라인이라 여기에 넣을 수
  # 없고, 누가 손으로 안 돌리면 UI 결함은 그대로 지나간다 — 색 대비·세로축·
  # 가로 넘침은 좌표와 색이라 `make screens` 의 200 응답으로는 잡히지 않는다.
  #
  # **DB 도 개발자와 같은 방식으로 띄운다** (`testdb.sh up`). services: 블록을
  # 쓰면 CI 전용 경로가 생기고, 갈라진 뒤에는 어느 쪽이 진짜인지 모른다 —
  # `ui.sh` 는 `docker ps --filter publish=55432` 로 그 컨테이너를 찾는다.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # `findChrome()` 이 PLAYWRIGHT_BROWSERS_PATH → macOS 캐시 → Linux 캐시
      # 순으로 훑는다. 못 찾으면 **건너뛰지 않고 중단한다** — "검증했다" 와
      # "검증할 수 없었다" 를 같은 exit 0 으로 두지 않는다.
      - run: npx --yes playwright@latest install --with-deps chromium
      - run: sh scripts/testdb.sh up
      - run: make ui

  # 취약점 조회는 네트워크가 필요해 `make check` 에 없다 (D21 1절). 여기서 돈다.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vuln
